name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-20.04 # Use older Ubuntu for better glibc compatibility
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        # PyQt5 often needs these system libraries to bundle correctly
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Raw Executable
        run: python build.py

      - name: Create AppImage
        run: bash create_appimage.sh

      - name: Rename Raw Executable
        run: mv dist/DiscordTerminator dist/DiscordTerminator-Linux-x86_64

      - name: Release Linux Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DiscordTerminator-Linux-x86_64
            Discord_Terminator-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Executable
        run: python build.py

      - name: Rename Executable
        # Rename so users know it's for Windows and not just "DiscordTerminator.exe"
        run: |
          cd dist
          mv DiscordTerminator.exe DiscordTerminator-Windows-Portable.exe

      - name: Release Windows Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/DiscordTerminator-Windows-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
